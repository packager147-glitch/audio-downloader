<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333333; display: flex; height: 100vh; overflow: hidden; }
        
        /* Main intake form section */
        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; background-color: #f4f4f9; }
        .converter-container { background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; width: 100%; max-width: 500px; border: 1px solid #e0e4ec; }
        h2 { font-size: 26px; margin-bottom: 10px; color: #007bff; letter-spacing: 0.5px; }
        p { color: #6c757d; font-size: 14px; margin-bottom: 25px; }
        input[type="text"] { width: 100%; padding: 14px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; background-color: #ffffff; color: #333; font-size: 15px; outline: none; transition: border-color 0.3s; }
        input[type="text"]:focus { border-color: #007bff; }
        button { background-color: #007bff; color: white; border: none; padding: 14px 28px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .loading-text { display: none; color: #007bff; margin-top: 15px; font-weight: bold; font-size: 14px; }

        /* Unified Top-To-Bottom Right Sidebar layout */
        .right-sidebar { width: 360px; background-color: #ffffff; border-left: 1px solid #e0e4ec; display: flex; flex-direction: column; height: 100%; }
        
        /* Music Player block (Top Side) */
        .player-section { padding: 25px; background: #f8f9fa; border-bottom: 1px solid #e0e4ec; text-align: center; }
        .player-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #007bff; text-transform: uppercase; letter-spacing: 1px; }
        .now-playing { font-size: 14px; color: #495057; margin-bottom: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; font-weight: 500; }
        audio { width: 100%; height: 40px; outline: none; border-radius: 30px; }

        /* Dynamic Download History List block (Bottom Side) */
        .list-section { flex: 1; padding: 25px; display: flex; flex-direction: column; overflow: hidden; }
        .list-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #6c757d; text-transform: uppercase; letter-spacing: 0.5px; }
        .download-list { list-style: none; overflow-y: auto; flex: 1; padding-right: 5px; }
        .download-list::-webkit-scrollbar { width: 6px; }
        .download-list::-webkit-scrollbar-thumb { background-color: #ced4da; border-radius: 4px; }
        .song-item { background: #ffffff; padding: 12px 15px; border-radius: 4px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e0e4ec; cursor: pointer; transition: all 0.2s; }
        .song-item:hover { background: #f8f9fa; border-color: #007bff; }
        .song-info { flex: 1; min-width: 0; padding-right: 10px; }
        .song-name { font-size: 13.5px; color: #333333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .play-icon { color: #007bff; font-size: 16px; font-weight: bold; }
        .empty-state { color: #adb5bd; font-size: 13px; text-align: center; margin-top: 30px; font-style: italic; }
    </style>
</head>
<body>

    <!-- Left Processing Intake Frame -->
    <div class="main-content">
        <div class="converter-container">
            <h2>Audio Downloader</h2>
            <p>Convert and stream your favorite SoundCloud tracks instantly</p>
            <form id="downloadForm">
                <input type="text" id="trackUrl" name="url" placeholder="Paste SoundCloud link here..." required>
                <button type="submit" id="submitBtn">Download MP3</button>
            </form>
            <div class="loading-text" id="loadingText">Processing audio streams from cloud networks...</div>
        </div>
    </div>

    <!-- Right-Hand Rectangular Interface Container (Top-to-Bottom) -->
    <div class="right-sidebar">
        
        <!-- Music Player Module (Top Section) -->
        <div class="player-section">
            <div class="player-title">🎵 Music Player</div>
            <div class="now-playing" id="nowPlayingText">No track selected</div>
            <audio id="mainAudioPlayer" controls></audio>
        </div>

        <!-- Downloaded Songs Database Module (Below Player Section) -->
        <div class="list-section">
            <div class="list-title">📥 Downloaded Tracks</div>
            <ul class="download-list" id="trackHistoryList">
                <!-- Entries loaded dynamically -->
            </ul>
        </div>
        
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingText = document.getElementById('loadingText');
        const audioPlayer = document.getElementById('mainAudioPlayer');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const trackHistoryList = document.getElementById('trackHistoryList');

        let downloadedTracks = JSON.parse(localStorage.getItem('downloadedTracks')) || [];

        function renderHistoryList() {
            trackHistoryList.innerHTML = '';
            if (downloadedTracks.length === 0) {
                trackHistoryList.innerHTML = '<div class="empty-state">No downloads found in this session</div>';
                return;
            }
            downloadedTracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = 'song-item';
                li.innerHTML = `
                    <div class="song-info">
                        <div class="song-name">${track.name}</div>
                    </div>
                    <div class="play-icon">▶</div>
                `;
                li.addEventListener('click', () => playTrack(track.name, track.blobData));
                trackHistoryList.appendChild(li);
            });
        }

        function playTrack(name, base64Blob) {
            nowPlayingText.innerText = name;
            audioPlayer.src = base64Blob;
            audioPlayer.play();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const trackUrl = document.getElementById('trackUrl').value;
            
            submitBtn.disabled = true;
            loadingText.style.display = 'block';

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'url': trackUrl })
                });

                if (!response.ok) throw new Error('Network validation block triggered.');

                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'downloaded_audio.mp3';
                if (contentDisposition && contentDisposition.includes('filename=')) {
                    filename = contentDisposition.split('filename=')[1].replace(/"/g, '');
                }

                const blob = await response.blob();
                
                const reader = new FileReader();
                reader.onloadend = function() {
                    const base64data = reader.result;
                    
                    downloadedTracks.unshift({ name: filename, blobData: base64data });
                    localStorage.setItem('downloadedTracks', JSON.stringify(downloadedTracks));
                    renderHistoryList();
                    playTrack(filename, base64data);
                }
                reader.readAsDataURL(blob);

                const downloadLink = document.createElement('a');
                downloadLink.href = URL.createObjectURL(blob);
                downloadLink.download = filename;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

                document.getElementById('trackUrl').value = '';

            } catch (err) {
                alert('Conversion failed: Ensure the link is correct and publicly viewable.');
            } finally {
                submitBtn.disabled = false;
                loadingText.style.display = 'none';
            }
        });

        renderHistoryList();
    </script>
</body>
</html>
